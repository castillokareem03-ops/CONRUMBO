workflows:
  conrumbo_android:
    name: conrumbo Android
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Preparar proyecto Flutter
        script: |
          unzip -o conrumbo_mvp_v12_compilable.zip -d /tmp/conrumbo
          cd /tmp/conrumbo
          flutter create . --platforms android
          flutter pub get

      - name: Generar APK
        script: |
          cd /tmp/conrumbo
          flutter build apk --release

    artifacts:
      - /tmp/conrumbo/build/app/outputs/flutter-apk/app-release.apk
